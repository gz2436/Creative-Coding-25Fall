<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDTERM PROJECT</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #fff;
            font-family: 'Inter', sans-serif;

            /* TRANSITION */
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.loaded {
            opacity: 1;
        }

        h1 {
            font-weight: 300;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: #111;
        }

        h2 {
            font-weight: 300;
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 4rem;
            letter-spacing: 0.05em;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
        }

        a.sketch-link {
            text-decoration: none;
            color: #111;
            font-size: 0.95rem;
            /* Reduced for elegance */
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: opacity 0.3s;
            position: relative;
        }

        a.sketch-link:hover {
            opacity: 0.5;
            letter-spacing: 0.1em;
            /* Subtle expansion on hover */
        }

        .back {
            position: absolute;
            bottom: 3rem;
            font-size: 0.7rem;
            color: #ccc;
            text-decoration: none;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }

        .back:hover {
            color: #333;
        }
    </style>
</head>

<body>
    <h1>Midterm Project</h1>
    <h2>Three studies on relational mechanics.</h2>

    <nav>
        <a href="distance.html" class="sketch-link transition-link" style="letter-spacing: 0.25em;">DISTANCE</a>
        <a href="threshold.html" class="sketch-link transition-link" style="letter-spacing: 0.13em;">THRESHOLD</a>
        <a href="presence.html" class="sketch-link transition-link" style="letter-spacing: 0.25em;">PRESENCE</a>
    </nav>

    <a href="../index.html" class="back transition-link">← HOME</a>

    <!-- TRANSITION LOGIC -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => document.body.classList.add('loaded'), 50);
        });

        document.querySelectorAll('.transition-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = link.href;
                document.body.style.opacity = '0';
                setTimeout(() => window.location.href = target, 500);
            });
        });
    </script>
</body>

</html>
